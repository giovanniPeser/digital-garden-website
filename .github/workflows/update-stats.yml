name: Update App Stats

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Stats Updater
        run: node scripts/update-stats.js

      - name: Validate stats.json
        run: node -e "JSON.parse(require('fs').readFileSync('data/stats.json','utf8'))"

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Update live Play Store statistics"
          file_pattern: 'data/stats.json'
